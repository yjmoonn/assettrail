name: Deploy GitHub Pages

on:
  schedule:
    - cron: "30 21 * * *"
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      generate_prices:
        description: "Regenerate prices.json before deploying"
        required: true
        default: true
        type: boolean

permissions: {}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  PAGES_URL: https://yjmoonn.github.io/assettrail
  STATIC_SITE_FILES: >-
    index.html app.js decision-engine.js action-engine.js ledger-engine.js
    performance-engine.js broker-csv-engine.js broker-csv-adapter-standard.js
    external-data-engine.js etf-exposure-engine.js ai-report-engine.js
    ai-review-export-engine.js history-repository.js styles.css
    assettrail-tokens.css assettrail-mark.svg firebase-config.js prices.json symbols.json .nojekyll

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      TZ: Asia/Seoul
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Audit high-severity dependencies
        run: npm audit --audit-level=high

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Check JavaScript syntax
        run: npm run check:js

      - name: Run JS tests
        run: |
          npm run test:decision
          npm run test:action
          npm run test:action-app
          npm run test:ledger
          npm run test:performance
          npm run test:broker-csv
          npm run test:stage5
          npm run test:ai-review
          npm run test:history
          npm run test:history-race
          npm run test:product
          npm run test:investment
          npm run test:prices
          npm run test:price-fallback
          npm run test:symbols
          npm run test:cloud
          npm run test:cloud-history-gc
          npm run test:cloud-conflict
          npm run test:cloud-auth-race
          npm run test:cloud-prices
          npm run test:data

      - name: Verify static site runtime files
        shell: bash
        run: |
          set -euo pipefail
          test -f prices.json || printf '%s\n' '{}' > prices.json
          test -f symbols.json || printf '%s\n' '{}' > symbols.json
          rm -rf _site
          mkdir _site
          cp $STATIC_SITE_FILES _site/
          node <<'NODE'
          const fs = require("node:fs");
          const path = require("node:path");

          const sources = ["index.html", "styles.css"]
            .map((file) => fs.readFileSync(file, "utf8"))
            .join("\n");
          const refs = [
            ...sources.matchAll(/(?:src|href)=["']([^"']+)["']/g),
            ...sources.matchAll(/url\(["']?([^"')]+)["']?\)/g)
          ].map((match) => match[1].split(/[?#]/, 1)[0])
            .filter((ref) => ref && !/^(?:[a-z]+:|\/\/|#)/i.test(ref));
          const missing = [...new Set(refs)]
            .filter((ref) => !fs.existsSync(path.join("_site", ref.replace(/^\.\//, ""))));
          if (missing.length) {
            throw new Error(`Static site is missing runtime files: ${missing.join(", ")}`);
          }
          NODE

      - name: Run Firestore Rules tests
        run: npm run test:firestore

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install price dependencies
        run: pip install -r requirements.txt

      - name: Run price generator tests
        run: npm run test:price-requests

  deploy:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify deployment source
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == "refs/heads/main" ]]
          [[ "$GITHUB_SHA" == "$(git rev-parse HEAD)" ]]

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Determine price mode
        id: price_mode
        shell: bash
        run: |
          set -euo pipefail

          generate="false"
          reason="reuse existing prices.json"

          if [[ "${{ github.event_name }}" == "schedule" ]]; then
            generate="true"
            reason="scheduled daily price update"
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            generate="${{ inputs.generate_prices }}"
            if [[ "$generate" == "true" ]]; then
              reason="manual price update requested"
            else
              reason="manual deploy without price update"
            fi
          elif [[ "${{ github.event_name }}" == "push" ]]; then
            before="${{ github.event.before }}"
            after="${{ github.sha }}"
            if [[ "$before" =~ ^0+$ ]]; then
              changed_files="$(git diff-tree --no-commit-id --name-only -r "$after")"
            else
              changed_files="$(git diff --name-only "$before" "$after")"
            fi

            echo "$changed_files" | sed 's/^/changed: /'
            if echo "$changed_files" | grep -Eq '^(tickers\.json|requirements\.txt|scripts/generate_prices\.py)$'; then
              generate="true"
              reason="price input or generator changed"
            fi
          fi

          echo "generate=$generate" >> "$GITHUB_OUTPUT"
          echo "reason=$reason" >> "$GITHUB_OUTPUT"
          echo "Price mode: $reason"

      - name: Set up Python
        if: steps.price_mode.outputs.generate == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install price dependencies
        if: steps.price_mode.outputs.generate == 'true'
        run: pip install -r requirements.txt

      - name: Generate prices
        if: steps.price_mode.outputs.generate == 'true'
        run: python scripts/generate_prices.py

      - name: Reuse deployed prices
        if: steps.price_mode.outputs.generate != 'true'
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            --retry 3 --retry-delay 2 --retry-all-errors \
            "$PAGES_URL/prices.json?v=${{ github.sha }}" \
            --output prices.json
          python -m json.tool prices.json >/dev/null

          symbols_ok="false"
          if curl --fail --silent --show-error --location \
            --retry 3 --retry-delay 2 --retry-all-errors \
            "$PAGES_URL/symbols.json?v=${{ github.sha }}" \
            --output symbols.reused.json; then
            if python -c 'import json, sys; data = json.load(open(sys.argv[1], encoding="utf-8")); sys.exit(0 if isinstance(data.get("generatedAt"), str) and isinstance(data.get("symbols"), dict) else 1)' symbols.reused.json; then
              mv symbols.reused.json symbols.json
              symbols_ok="true"
            fi
          fi

          if [[ "$symbols_ok" != "true" ]]; then
            rm -f symbols.reused.json
            echo "::warning::Deployed symbols.json could not be reused; using inline legacy symbols or an empty directory."
            python - prices.json symbols.json <<'PY'
          import json
          import sys
          from pathlib import Path

          prices = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          symbols = prices.get("symbols")
          if not isinstance(symbols, dict):
              symbols = {"KRX": {}, "US": {}}
          generated_at = prices.get("symbolsGeneratedAt") or prices.get("generatedAt")
          payload = {"generatedAt": generated_at, "symbols": symbols}
          Path(sys.argv[2]).write_text(
              json.dumps(payload, ensure_ascii=False, separators=(",", ":"), sort_keys=True),
              encoding="utf-8"
          )
          PY
          fi

      - name: Prepare static site
        run: |
          rm -rf _site
          mkdir _site
          cp $STATIC_SITE_FILES _site/

      - name: Upload static site
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
